name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/m05-public-productization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and test
        run: npm run check

      - name: Build web demo
        run: npm run web:build

      - name: Build web demo for GitHub Pages
        run: npm run web:build:pages

      - name: Scan git history for obvious credential material
        shell: bash
        run: |
          set -euo pipefail

          private_key_pattern="-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----"
          github_pat_pattern='github_pat_''[A-Za-z0-9_]{20,}'
          github_classic_pattern='ghp_''[A-Za-z0-9]{20,}'
          aws_pattern='AKIA''[0-9A-Z]{16}'
          slack_pattern='xox''[baprs]-[A-Za-z0-9-]{20,}'

          patterns=(
            "$private_key_pattern"
            "$github_pat_pattern"
            "$github_classic_pattern"
            "$aws_pattern"
            "$slack_pattern"
          )

          for pattern in "${patterns[@]}"; do
            matches="$(git log --all --full-history -G "$pattern" --format='%H %s' -- . ':!.github/workflows/release-gate.yml' || true)"
            if [ -n "$matches" ]; then
              echo "Potential credential pattern found."
              echo "$matches"
              exit 1
            fi
          done

          echo "No obvious credential patterns found in git history.";
